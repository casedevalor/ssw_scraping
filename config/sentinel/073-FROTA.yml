# Column baseline for SSW routine 073 — FROTA (own fleet) file.
#
# Routine 073 downloads a .zip holding two csv files (FROTA and TERCEIROS);
# each one is checked against its own baseline. The file name must match
# the name the bot gives each file inside the zip ('073-FROTA').
#
# This is the contract the column sentinel checks every downloaded file
# against: position (1-based) -> exact header name. Any difference in
# count, name or position is reported in the log.
#
# No processing step: this is the raw SSW file, exactly as it is uploaded.
#
# To accept a legitimate SSW change, update this file — never the code.
routine: '073-FROTA'
# header_line omitted: the header is auto-detected in the first lines
delimiter: ';'
encoding: 'windows-1252'
columns:
  1: '1'                    # SSW row counter
  2: 'CTRB'
  3: 'TIPO'
  4: 'SITUACAO'
  5: 'DATA E HORA EMISSAO'
  6: 'USUARIO EMISSAO'
  7: 'PLACA CAVALO'
  8: 'PROPRIEDADE'
  9: 'CNPJ/CPF PROPRIETARIO'
  10: 'PROPRIETARIO'
  11: 'CONTA BANCARIA'
  12: 'PLACA CARRETA 1'
  13: 'PLACA CARRETA 2'
  14: 'CPF MOTORISTA'
  15: 'MOTORISTA'
  16: 'CPF MOTORISTA 2'
  17: 'MOTORISTA 2'
  18: 'CIDADE/UF ORIGEM'
  19: 'UNIDADE DESTINO'
  20: 'CIDADE/UF DESTINO'
  21: 'PASSAR POR (1)'
  22: 'PASSAR POR (2)'
  23: 'PASSAR POR (3)'
  24: 'PASSAR POR (4)'
  25: 'PASSAR POR (5)'
  26: 'PASSAR POR (6)'
  27: 'DISTANCIA KM'
  28: 'PREVISAO CHEGADA'
  29: 'CHEGADA'
