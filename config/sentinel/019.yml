  8: 'SUBC'
  9: 'REMETENTE'
  10: 'PAGADOR'
  11: 'ABC'
  12: 'DESTINATARIO'
  13: 'CIDADE'
  14: 'UF'
  15: 'SET'
  16: 'MERCADORIA'
  17: 'FRETE'
  18: 'KgREA'
  19: 'M3'
