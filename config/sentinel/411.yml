# Column baseline for SSW routine 411.
#
# This is the contract the column sentinel checks every downloaded file
# against: position (1-based) -> exact header name. Any difference in
# count, name or position is reported in the log.
#
# Routine 411 has no processing step: this is the raw SSW file, exactly
# as it is uploaded.
#
# To accept a legitimate SSW change, update this file — never the code.
routine: '411'
# header_line omitted: the header is auto-detected in the first lines
delimiter: ';'
encoding: 'windows-1252'
columns:
  1: '1'                    # SSW row counter
  2: 'CTRC'
  3: 'Numero CT-e'
  4: 'Numero do formulario'
  5: 'Data Emissao'
  6: 'Tipo'
  7: 'CNPJ Remetente'
  8: 'Nome Remetente'
  9: 'CNPJ Destinatario'
  10: 'Nome Destinatario'
  11: 'CNPJ Pagador'
  12: 'Nome Pagador'
  13: 'UF'
  14: 'Cidade'
  15: 'Vlr Frete'
  16: 'Vlr Juro'
  17: 'Vlr Desconto'
  18: 'Valor Liqu'
  19: 'Data Liquid'
  20: 'Unidade Liqui'
  21: 'Forma Liqu'
  22: 'Banco Ag. Conta'
  23: 'Fatura'
  24: 'Data Credito Caixa'
  25: 'Vendedor'
  26: 'Cidade Destino'
  27: 'UF Destino'
  28: 'Login'
  29: 'Cod Mercadoria'
