# Column baseline for SSW routine 103.
#
# This is the contract the column sentinel checks every downloaded file
# against: position (1-based) -> exact header name. Any difference in
# count, name or position is reported in the log.
#
# It describes the file AFTER processing (Dataframe_Analytics.processing_csv_103),
# which keeps only config.yml -> variables.bot_103.columns_103, in that order.
# This list must stay identical to columns_103: changing one means changing
# the other.
#
# To accept a legitimate SSW change, update this file — never the code.
routine: '103'
header_line: 1          # processing rewrites the file with the header on line 1
delimiter: ';'
encoding: 'windows-1252'
columns:
  1: '1'                    # SSW row counter
  2: 'UNIDADE'
  3: 'NUMERO_COLETA'
  4: 'DATA_INCLUSAO'
  5: 'HORA_INCLUSAO'
