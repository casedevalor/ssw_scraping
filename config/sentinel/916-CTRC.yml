# Column baseline for SSW routine 916 — CTRC band (header line 3).
#
# This is the contract the column sentinel checks every downloaded file
# against: position (1-based) -> exact header name. Any difference in
# count, name or position is reported in the log.
#
# The 916 file ("BANCO_DE_DADOS_DO_MANIFESTO") has two header bands:
#   line 1: title (company name, report name, timestamp) — not checked
#   line 2: manifest header (916-MANIFESTO.yml) -> data lines starting with '3'
#   line 3: CTRC header (this file)             -> data lines starting with '4'
# Both baselines are checked against the same file (downloads.py,
# SENTINEL_BASELINES).
#
# Columns O..T are empty in this band (the file is 20 columns wide only
# because of the manifest header); trailing empty cells are ignored, so
# they are not listed.
#
# Routine 916 has no processing step: this is the raw SSW file, exactly
# as it is uploaded (screen-156 path, checked by downloads.py).
#
# To accept a legitimate SSW change, update this file — never the code.
routine: '916-CTRC'
header_line: 3
delimiter: ';'
encoding: 'windows-1252'
columns:
  1: '2'                    # band code of the CTRC header (data lines carry '4')
  2: 'sigla_manifesto'
  3: 'numero_manifesto'
  4: 'sigla_ctrc'
  5: 'numero_ctrc'
  6: 'valor_frete'
  7: 'peso'
  8: 'vlr mercad'
  9: 'nome destinatario'
  10: 'placa do veiculo'
  11: 'cubagem'
  12: 'peso_real'
  13: 'icms'
  14: 'praca_destino'
