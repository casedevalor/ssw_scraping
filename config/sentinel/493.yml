# Column baseline for SSW routine 493.
#
# This is the contract the column sentinel checks every downloaded file
# against: position (1-based) -> exact header name. Any difference in
# count, name or position is reported in the log.
#
# Routine 493 has no processing step: this is the raw SSW file, exactly
# as it is uploaded (screen-156 path, checked by downloads.py). The empty
# 50th column from SSW's trailing ';' is ignored, so it is not listed.
# 'CPNJ_REMETENTE' is SSW's own spelling — keep it.
#
# To accept a legitimate SSW change, update this file — never the code.
routine: '493'
# header_line omitted: the header is auto-detected in the first lines
delimiter: ';'
encoding: 'windows-1252'
columns:
  1: '0'                    # first column header as SSW delivers it ('0', not the usual '1')
  2: 'CNPJ_PAGADOR'
