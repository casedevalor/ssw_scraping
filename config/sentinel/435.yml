# Column baseline for SSW routine 435 (CSV option only).
#
# This is the contract the column sentinel checks every downloaded file
# against: position (1-based) -> exact header name. Any difference in
# count, name or position is reported in the log.
#
# Routine 435 has no processing step: this is the raw SSW csv (option "S"),
# exactly as it is uploaded. The TXT option ("N") is a text report with no
# column header and is not checked.
#
# To accept a legitimate SSW change, update this file — never the code.
routine: '435'
# header_line omitted: the header is auto-detected in the first lines
delimiter: ';'
encoding: 'windows-1252'
columns:
  1: '1'                    # SSW row counter
  2: 'EM'
  3: 'CTRC'
  4: 'NUMERO CT-e/NFPS'
  5: 'PAGADOR'
  6: 'CNPJ PAGADOR'
  7: 'COB'
  8: 'DEST'
  9: 'BANCO'
  10: 'FRETE'
  11: 'EMISSAO'
  12: 'CANHOT'
  13: 'NFISCAL'
  14: 'ICMS'
  15: 'MER'
  16: 'TIP'
  17: 'PRE-FATU'
  18: 'CTRC ORIGEM'
  19: 'CAPA REMESSA'
  20: 'NRO PACOTE'
  21: 'NRO PEDIDO'
  22: 'TIPO DOC'
  23: 'ULT. OCOR'
  24: 'ULT MVTO CLIENTE'
  25: 'CHAVE CTE'
  26: 'DATA ENTREGA'
  27: 'CNPJ REMETENTE'
  28: 'REMETENTE'
  29: 'CIDADE DO REMETENTE'
  30: 'UF DO REMETENTE'
  31: 'CIDADE DO PAGADOR'
  32: 'UF DO PAGADOR'
  33: 'CNPJ DESTINATARIO'
  34: 'DESTINATARIO'
  35: 'CIDADE DO DESTINATARIO'
  36: 'UF DO DESTINATARIO'
  37: 'PREVISAO DE ENTREGA'
  38: 'COMPROVANTE DE ENTREGA ESCANEADO'
  39: 'OBSERVACAO'
  40: 'DEMAIS NOTAS'
