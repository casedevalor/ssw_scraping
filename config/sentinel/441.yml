# Column baseline for SSW routine 441.
#
# This is the contract the column sentinel checks every downloaded file
# against: position (1-based) -> exact header name. Any difference in
# count, name or position is reported in the log.
#
# It describes the file AFTER processing (Dataframe_Analytics.processing_csv_441).
#
# DORMANT today: processing_csv_441 renames 'Unnamed: 53', fills any missing column
# with blanks and keeps only config.yml -> variables.bot_441.columns_441, in
# that order — so the processed header always equals that list.
# The check runs and logs OK, but it cannot catch an SSW change while the
# processing works this way. It is kept ready for when the fixed column list is replaced by
# another method. Keep it identical to columns_441 meanwhile.
#
# To accept a legitimate change, update this file — never the code.
routine: '441'
header_line: 1          # processing rewrites the file with the header on line 1
delimiter: ';'
encoding: 'windows-1252'
columns:
  1: '1'                    # SSW row counter
  2: 'FATURA'
  3: 'CNPJ/CPF'
  4: 'CLIENTE'
  5: 'ABC'
  6: 'VENDEDOR'
